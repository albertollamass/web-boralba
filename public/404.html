<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script>
      ;(function () {
        try {
          var path = window.location.pathname
          window.location.replace('/?spa=' + encodeURIComponent(path + window.location.search + window.location.hash))
        } catch (e) {
          window.location.replace('/')
        }
      })()
    </script>
  </head>
  <body></body>
</html>
