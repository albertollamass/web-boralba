<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script>
      ;(function () {
        try {
          var path = window.location.pathname
          var base = '/web-boralba'
          if (path.indexOf(base) === 0) {
            path = path.slice(base.length) || '/'
          }
          sessionStorage.setItem('redirect', base + path + window.location.search)
        } catch (e) {}
        window.location.replace('/web-boralba/')
      })()
    </script>
  </head>
  <body></body>
</html>
