<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script>
      ;(function () {
        try {
          var base = '/web-boralba'
          var path = window.location.pathname
          if (path.indexOf(base) === 0) {
            path = path.slice(base.length) || '/'
          }
          window.location.replace(base + '/?spa=' + encodeURIComponent(path + window.location.search))
        } catch (e) {
          window.location.replace('/web-boralba/')
        }
      })()
    </script>
  </head>
  <body></body>
</html>
