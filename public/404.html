<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script>
      ;(function () {
        var path = window.location.pathname
        if (path.indexOf('/web-boralba/') === 0) {
          path = path.slice('/web-boralba'.length)
        }
        window.location.replace(
          window.location.origin + '/web-boralba/index.html' + window.location.search + path,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
